<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="css/Style.css" />
  </head>
  <body>
    <main class="menu login">
      <div class="logo-login"><img src="Imagens/logo.png" alt="SaberTI" /></div>
      <p>Entre para acessar os cadastros.</p>
      <form id="formLogin">
        <label>Usuário<input id="usuario" type="text" required /></label
        ><label>Senha<input id="senha" type="password" required /></label>
        <div class="acoes"><button type="submit">Entrar</button></div>
      </form>
      <p id="mensagem" aria-live="polite"></p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/Supabase.js"></script>
    <script src="js/Login.js"></script>
  </body>
</html>
